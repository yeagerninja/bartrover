controller_manager:
  ros__parameters:
    update_rate: 30

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:

    publish_rate: 50.0

    base_frame_id: base_link
    odom_frame_id: odom

    #use_stamped_vel: false

    #wheels_per_side: 1
    #left_wheel_names: ['rear_left_wheel_joint']
    #right_wheel_names: ['rear_right_wheel_joint']
    left_wheel_names: ['rear_left_wheel_joint', 'middle_left_wheel_joint', 'front_left_wheel_joint']
    right_wheel_names: ['rear_right_wheel_joint', 'middle_right_wheel_joint', 'front_right_wheel_joint']
    
    wheel_separation: 0.15
    wheel_radius: 0.035


    

    
